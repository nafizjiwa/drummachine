<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <link rel='stylesheet' href="styles.css">
  </head>
  <body>
    <!--DRUM MACHINE-->
    <div id="drum-machine" class='drum-machine'>
      <!--DRUM PAD-->
      <div class='pad-bank' id="pad-bank">
       <button class="drum-pad" class='drum-pad' id="Q">
            <p>Q</p>
            <audio class="clip" id='Q' src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad' id="W">
            <p>W</p>
            <audio class="clip" id='W' src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad' id="E">
            <p>E</p>
            <audio class="clip" id='E' src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad' id="A">
            <p>A</p>
            <audio class="clip" id='A' src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad' id="S">
            <p>S</p>
            <audio class="clip" id='S' src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad' id="D">
            <p>D</p>
            <audio class="clip" id='D' src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad' id="Z">
            <p>Z</p>
            <audio class="clip" id='Z' src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad' id="X">
            <p>X</p>
            <audio class="clip" id='X' src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3">
            </audio>
       </button>
       <button class="drum-pad" class='drum-pad'id="C">
            <p>C</p>
            <audio class="clip" id='C' src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3">
            </audio>
       </button>
      </div>
      <!--DRUM PAD-->
      <p class="display" id="display"></p>
      <audio id="myAudio" src='music.mp3'></audio>
      <label class="label">VOLUME:</label>
      <input type="range" class='slider' id="volSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <!--DRUM MACHINE-->
    
<!--     <script src= "script.js"></script> -->
  </body>
<!-- </html> -->
